<!DOCTYPE html>
<html lang="hu">

<title>Fesztiválpult POS</title>
<meta name="theme-color" content="#020617" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fesztiválpult" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="tailwind.css" />
<style>
  html, body { height: 100%; overscroll-behavior: contain; -webkit-tap-highlight-color: transparent; }
  * { -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .glow-ok { box-shadow: 0 0 40px -8px #10b981; }
  .glow-warn { box-shadow: 0 0 40px -8px #f43f5e; }
  .glow-idle { box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .catbtn { transition: transform .08s ease, background-color .15s ease, border-color .15s ease; }
  .catbtn:active, .prodcard:active, .qty-btn:active, #btnCheckout:active { transform: scale(0.96); }
  .prodcard { transition: transform .08s ease, border-color .15s ease; }

  /* Dynamic layout: driven by orientation + fluid sizing, works across phone and tablet without fixed breakpoints */
  #mainLayout { display: flex; flex-direction: column; flex: 1 1 0%; min-height: 0; }
  #productSection { border-bottom: 1px solid #1e293b; }
  #cartAside { width: 100%; max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
  #productGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; }
  @media (orientation: landscape) {
    #mainLayout { flex-direction: row; }
    #productSection { border-bottom: none; border-right: 1px solid #1e293b; }
    #cartAside { width: clamp(260px, 30vw, 460px); max-height: none; overflow-y: auto; }
    #productGrid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
</style>
</head>
<body class="bg-slate-950 text-slate-100">
<div id="app" class="h-screen w-screen flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="flex items-center justify-between gap-3 px-4 py-2.5 bg-slate-900 border-b border-slate-800 shrink-0">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-lg bg-amber-500 flex items-center justify-center font-black text-slate-950 text-lg">P</div>
      <h1 class="text-lg font-extrabold tracking-tight leading-none">Fesztiválpult <span class="text-slate-500 font-semibold">POS</span></h1>
    </div>
    <div class="flex items-center gap-3">
      <span id="clock" class="text-sm text-slate-400 tabular-nums hidden sm:inline"></span>
      <button id="btnInstall" class="hidden px-3 py-2 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 active:scale-95 border border-amber-500/40 text-amber-300 text-sm font-semibold transition">⬇ Telepítés</button>
      <button id="btnAdmin" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-sm font-semibold transition">⚙ Admin</button>
    </div>
  </header>

  <!-- MAIN -->
  <main id="mainLayout" class="min-h-0">

    <!-- LEFT: products -->
    <section id="productSection" class="flex-1 min-h-0 flex flex-col overflow-hidden">
      <div id="catTabs" class="flex gap-2 overflow-x-auto px-3 py-3 shrink-0"></div>
      <div class="px-3 pb-2 shrink-0">
        <input id="searchInput" type="search" placeholder="🔍 Keresés a termékek között..."
          class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-800 text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500" />
      </div>
      <div id="categoryNote" class="hidden mx-3 mb-2 px-3 py-2 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold shrink-0"></div>
      <div id="productGrid" class="flex-1 overflow-y-auto p-3 pt-1 gap-3 content-start"></div>
    </section>

    <!-- RIGHT: cart -->
    <aside id="cartAside" class="shrink-0 flex flex-col bg-slate-900 min-h-0">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 shrink-0">
        <h2 class="font-bold">Rendelés <span id="cartCount" class="text-slate-500 font-medium text-sm"></span></h2>
        <button id="btnClearCart" class="text-xs text-slate-500 hover:text-rose-400 font-semibold">Kosár ürítése</button>
      </div>

      <div id="cartItems" class="px-3 py-2 space-y-2 min-h-[60px]"></div>

      <div class="shrink-0 border-t border-slate-800 p-3.5 space-y-3">
        <div class="flex items-baseline justify-between">
          <span class="text-slate-400 text-sm font-semibold">Végösszeg</span>
          <span id="cartTotal" class="text-3xl font-black tabular-nums">0 Ft</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button data-pay="KP" class="pay-btn py-3 rounded-xl border-2 border-slate-700 bg-slate-800 font-bold text-sm transition">💵 KP</button>
          <button data-pay="REVOLUT" class="pay-btn py-3 rounded-xl border-2 border-slate-700 bg-slate-800 font-bold text-sm transition">💳 REVOLUT</button>
        </div>

        <div id="cashSection" class="space-y-2">
          <div class="grid grid-cols-5 gap-1.5" id="quickCash"></div>
          <div class="flex items-center gap-1.5">
            <input id="receivedInput" type="number" inputmode="numeric" placeholder="Kapott összeg"
              class="flex-1 min-w-0 px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-right font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-amber-500" />
            <button id="btnExact" class="px-2.5 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold hover:bg-slate-700 shrink-0">Pontos</button>
            <button id="btnResetReceived" class="px-2.5 py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs hover:bg-slate-700 shrink-0">✕</button>
          </div>
        </div>

        <div id="changeBox" class="rounded-xl p-3 text-center glow-idle bg-slate-800/60 border border-slate-700 transition-all">
          <div id="changeLabel" class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Visszajáró</div>
          <div id="changeValue" class="text-2xl font-black tabular-nums">0 Ft</div>
        </div>

        <button id="btnCheckout" disabled
          class="w-full py-4 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-lg disabled:opacity-30 disabled:cursor-not-allowed hover:bg-amber-400 active:scale-[0.98] transition">
          Fizetés rögzítése
        </button>
      </div>
    </aside>
  </main>
</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="fixed inset-0 z-50 hidden">

function fallbackColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return `hsl(${h} 70% 60%)`;
}
function catColor(name) { return CATEGORY_COLORS[name] || fallbackColor(name); }

/* ======================= STORAGE ======================= */

const LS_PRODUCTS = "pos_products_v1";
const LS_TX = "pos_transactions_v1";
const LS_CART = "pos_cart_v1";
const LS_PIN = "pos_admin_pin_v1";
const LS_HISTORY = "pos_shift_history_v1";
const DEFAULT_PIN = "1234";

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.error("Mentési hiba:", key, e); }
}

/* ======================= STATE ======================= */

const state = {
  products: loadJSON(LS_PRODUCTS, DEFAULT_PRODUCTS),
  transactions: loadJSON(LS_TX, []),
  cart: loadJSON(LS_CART, []),
  shiftHistory: loadJSON(LS_HISTORY, []),
  pin: loadJSON(LS_PIN, DEFAULT_PIN),
  category: "ALL",
  search: "",
  payment: null,
  received: 0
};
if (!localStorage.getItem(LS_PRODUCTS)) saveJSON(LS_PRODUCTS, state.products);

function persistProducts() { saveJSON(LS_PRODUCTS, state.products); }
function persistTx() { saveJSON(LS_TX, state.transactions); }
function persistCart() { saveJSON(LS_CART, state.cart); }
function persistHistory() { saveJSON(LS_HISTORY, state.shiftHistory); }
function persistPin() { saveJSON(LS_PIN, state.pin); }

let adminUnlocked = false;
let pinBuffer = "";

/* ======================= HELPERS ======================= */

const fmtFt = n => new Intl.NumberFormat("hu-HU").format(Math.round(n || 0)) + " Ft";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function getCategories() {
  const seen = [];
  CATEGORY_ORDER.forEach(c => { if (state.products.some(p => p.category === c)) seen.push(c); });
  state.products.forEach(p => { if (!seen.includes(p.category)) seen.push(p.category); });
  return seen;
}
function cartTotal() { return state.cart.reduce((s, l) => s + l.price * l.qty, 0); }
function cartCount() { return state.cart.reduce((s, l) => s + l.qty, 0); }

function isToday(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}
function getAllTransactionsEver() {
  let all = [...state.transactions];
  state.shiftHistory.forEach(s => { all = all.concat(s.transactions); });
  return all;
}
function getDailyTransactions() {
  return getAllTransactionsEver().filter(t => isToday(t.time));
}
function computeStats(txs) {
  const total = txs.reduce((s, t) => s + t.total, 0);
  const kp = txs.filter(t => t.payment === "KP").reduce((s, t) => s + t.total, 0);
  const rv = txs.filter(t => t.payment === "REVOLUT").reduce((s, t) => s + t.total, 0);
  const itemsSold = txs.reduce((s, t) => s + t.items.reduce((a, i) => a + i.qty, 0), 0);
  return { total, kp, rv, itemsSold, count: txs.length };
}

/* ======================= RENDER: PAYMENT / CASH / CHANGE ======================= */

function renderQuickCash() {
  document.getElementById("quickCash").innerHTML = QUICK_CASH.map(v => `
    <button data-cash="${v}" class="py-2.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs font-bold tabular-nums">
      +${new Intl.NumberFormat("hu-HU").format(v)}
    </button>`).join("");
}

function renderPayment() {
  document.querySelectorAll(".pay-btn").forEach(btn => {
    const isKP = btn.dataset.pay === "KP";
    const active = state.payment === btn.dataset.pay;
    const activeColor = isKP ? "#10b981" : "#6366f1";
    btn.style.backgroundColor = active ? activeColor : "#1e293b";
    btn.style.borderColor = active ? activeColor : "#334155";
    btn.style.color = active ? "#0f172a" : "#e2e8f0";
  });
  const cashSection = document.getElementById("cashSection");
  cashSection.style.display = state.payment === "REVOLUT" ? "none" : "";
}

function renderChangeAndCheckout() {
  const total = cartTotal();
  const box = document.getElementById("changeBox");
  const label = document.getElementById("changeLabel");
  const value = document.getElementById("changeValue");
  box.classList.remove("glow-ok", "glow-warn", "glow-idle");

  let effectiveReceived = state.payment === "REVOLUT" ? total : state.received;
  const diff = effectiveReceived - total;

  if (state.payment === "REVOLUT") {
    label.textContent = "Kártyás fizetés";
    value.textContent = "Nincs visszajáró";
    value.className = "text-xl font-black text-indigo-300";
    box.classList.add("glow-idle");
    box.style.borderColor = "#4338ca";
  } else if (!state.cart.length) {
    label.textContent = "Visszajáró";
    value.textContent = "0 Ft";
    value.className = "text-2xl font-black tabular-nums text-slate-300";
    box.classList.add("glow-idle");
    box.style.borderColor = "#334155";
  } else if (diff < 0) {
    label.textContent = "Hiányzik";
    value.textContent = fmtFt(-diff);
    value.className = "text-2xl font-black tabular-nums text-rose-400";
    box.classList.add("glow-warn");
    box.style.borderColor = "#f43f5e";
  } else {
    label.textContent = "Visszajáró";
    value.textContent = fmtFt(diff);
    value.className = "text-2xl font-black tabular-nums text-emerald-400";
    box.classList.add("glow-ok");
    box.style.borderColor = "#10b981";
  }

  const receivedInput = document.getElementById("receivedInput");
  if (document.activeElement !== receivedInput) receivedInput.value = state.received || "";

  const checkoutBtn = document.getElementById("btnCheckout");
  const canCheckout = state.cart.length > 0 && state.payment &&
    (state.payment === "REVOLUT" || state.received >= total);
  checkoutBtn.disabled = !canCheckout;
}

/* ======================= CART ACTIONS ======================= */

function addToCart(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  const line = state.cart.find(l => l.productId === p.id);
  if (line) line.qty++;
  else state.cart.push({ id: "l" + Date.now() + Math.random().toString(36).slice(2, 6), productId: p.id, name: p.name, price: p.price, category: p.category, qty: 1 });
  persistCart();
  renderCart();
}
function changeQty(lineId, delta) {
  const line = state.cart.find(l => l.id === lineId);
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) state.cart = state.cart.filter(l => l.id !== lineId);
  persistCart();
  renderCart();
}
function removeLine(lineId) {
  state.cart = state.cart.filter(l => l.id !== lineId);
  persistCart();
  renderCart();
}
function clearCart() {
  if (!state.cart.length) return;
  if (!confirm("Biztosan kiüríted a kosarat?")) return;
  state.cart = [];
  state.received = 0;
  persistCart();
  renderCart();
}

/* ======================= CHECKOUT ======================= */

function checkout() {
  const total = cartTotal();
  if (!state.cart.length || !state.payment) return;
  if (state.payment === "KP" && state.received < total) return;

  const tx = {
    id: "t" + Date.now() + Math.random().toString(36).slice(2, 6),
    time: new Date().toISOString(),
    items: state.cart.map(l => ({ name: l.name, category: l.category, price: l.price, qty: l.qty })),
    total,
    payment: state.payment,
    received: state.payment === "KP" ? state.received : total,
    change: state.payment === "KP" ? (state.received - total) : 0
  };
  state.transactions.push(tx);
  persistTx();

  state.cart = [];
  state.received = 0;
  persistCart();
  renderCart();
}

  `).join("");

  pinBuffer = "";
  pinError.classList.add("hidden");
  renderPinDots();
  pinModal.classList.remove("hidden");
}
function closePinModal() {
  pinModal.classList.add("hidden");
  pinBuffer = "";
}

document.getElementById("pinKeypad").addEventListener("click", e => {
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const key = btn.dataset.key;
  if (key === "back") { pinBuffer = pinBuffer.slice(0, -1); pinError.classList.add("hidden"); renderPinDots(); return; }
  if (pinBuffer.length >= state.pin.length) return;
  pinBuffer += key;
  renderPinDots();
  if (pinBuffer.length === state.pin.length) {
    if (pinBuffer === state.pin) {
      adminUnlocked = true;
      closePinModal();
      openAdmin();
    } else {
      pinError.classList.remove("hidden");
      pinBuffer = "";
      setTimeout(renderPinDots, 50);

  }
});

/* ======================= ADMIN: LOG ======================= */

function renderAdminLog() {
  const txs = state.transactions;
  const agg = {};
  txs.forEach(t => t.items.forEach(i => {
    if (!agg[i.name]) agg[i.name] = { qty: 0, revenue: 0, category: i.category };
    agg[i.name].qty += i.qty;
    agg[i.name].revenue += i.qty * i.price;
  }));
  const aggRows = Object.entries(agg).sort((a, b) => b[1].revenue - a[1].revenue);

  const summaryHtml = aggRows.length ? `
    <div class="overflow-x-auto rounded-xl border border-slate-700">

              <td class="px-3 py-2"><span class="inline-block w-2 h-2 rounded-full mr-2" style="background:${catColor(d.category)}"></span>${esc(name)}</td>
              <td class="px-3 py-2 text-right tabular-nums font-bold">${d.qty}</td>

        </tbody>
      </table>
    </div>` : `<p class="text-slate-500 text-sm">Még nincs rögzített eladás.</p>`;

  const txHtml = txs.length ? [...txs].reverse().map(t => {
    const time = new Date(t.time).toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" });

        <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
      </div>
      <div class="w-full min-w-[220px] flex-1">
        <label class="text-xs text-slate-400 block mb-1">🧪 Keverési segédlet (opcionális)</label>
        <input id="newProdRecipe" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-sm" placeholder="pl. 4cl vodka + 2dl paradicsomlé" />
      </div>
      <button id="btnAddProduct" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold text-sm hover:bg-amber-400">+ Hozzáadás</button>
    </div>
    <h3 class="text-lg font-bold mb-2">Termékek szerkesztése</h3>
    ${groups || `<p class="text-slate-500 text-sm">Nincs termék.</p>`}
  `;

  document.getElementById("btnAddProduct").addEventListener("click", () => {
    const name = document.getElementById("newProdName").value.trim();
    const price = Number(document.getElementById("newProdPrice").value);
    const category = document.getElementById("newProdCat").value.trim();
    const recipe = document.getElementById("newProdRecipe").value.trim();
    if (!name || !category || !(price >= 0)) { alert("Add meg a termék nevét, kategóriáját és érvényes árát."); return; }
    const newProd = { id: "p" + Date.now() + Math.random().toString(36).slice(2, 6), name, price, category };
    if (recipe) newProd.recipe = recipe;
    state.products.push(newProd);
    persistProducts();
    renderAdminProducts();
    renderCatTabs();
    renderProducts();
  });

  panel.querySelectorAll('input[data-field="name"]').forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.products.find(x => x.id === inp.dataset.pid);
      if (p) { p.name = inp.value.trim() || p.name; persistProducts(); renderProducts(); }
    });
  });
  panel.querySelectorAll('input[data-field="price"]').forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.products.find(x => x.id === inp.dataset.pid);
      if (p) { const v = Number(inp.value); if (v >= 0) { p.price = v; persistProducts(); renderProducts(); } }
    });
  });
  panel.querySelectorAll('input[data-field="recipe"]').forEach(inp => {
    inp.addEventListener("change", () => {
      const p = state.products.find(x => x.id === inp.dataset.pid);
      if (p) { const v = inp.value.trim(); if (v) p.recipe = v; else delete p.recipe; persistProducts(); renderProducts(); }
    });
  });
  panel.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = state.products.find(x => x.id === btn.dataset.del);
      if (!p) return;
      if (!confirm(`Törlöd a következő terméket?\n\n${p.name} — ${fmtFt(p.price)}`)) return;
      state.products = state.products.filter(x => x.id !== p.id);
      persistProducts();
      renderAdminProducts();
      renderCatTabs();
      renderProducts();
    });
  });
}

/* ======================= ADMIN: DATA MANAGEMENT ======================= */

function exportCSV() {
  const rows = [["Tranzakció ID", "Időpont", "Fizetési mód", "Tételek", "Kapott (Ft)", "Visszajáró (Ft)", "Végösszeg (Ft)"]];
  state.transactions.forEach(t => {
    const itemsStr = t.items.map(i => `${i.name} x${i.qty} (${i.price} Ft/db)`).join(" | ");
    rows.push([t.id, new Date(t.time).toLocaleString("hu-HU"), t.payment, itemsStr, t.received, t.change, t.total]);
  });
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell).replace(/"/g, '""');
    return /[;"\n]/.test(s) ? `"${s}"` : s;
  }).join(";")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `eladasok_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ======================= PWA: TELEPÍTHETŐSÉG, OFFLINE, ÉBREN TARTÁS ======================= */

// Service worker regisztráció - offline működéshez (fesztiválon a net néha megbízhatatlan)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service worker regisztráció sikertelen:", err));
  });
}

// "Telepítés" gomb - Android Chrome-on saját ikonnal, teljes képernyős módban indítható appá teszi
let deferredInstallPrompt = null;
const btnInstall = document.getElementById("btnInstall");
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  btnInstall.classList.remove("hidden");
});
btnInstall.addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  btnInstall.classList.add("hidden");
});
window.addEventListener("appinstalled", () => btnInstall.classList.add("hidden"));

// Screen Wake Lock - ne aludjon el a tablet pénztárazás közben
let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
  } catch (err) { console.warn("Wake lock nem elérhető:", err); }
}
requestWakeLock();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") requestWakeLock();
});

// Fekvő tájolás rögzítése, ha telepített (standalone) app módban fut
if (screen.orientation && screen.orientation.lock) {
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if (isStandalone) screen.orientation.lock("landscape").catch(() => {});
}
